name: Монитор цен «мы стали дороже» (почасовой)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = посчитать и показать в логе, ничего не слать"
        required: false
        default: ""
      force:
        description: "1 = прислать ВСЕ текущие превышения, игнорируя прошлое состояние"
        required: false
        default: ""
  schedule:
    # 05:00–19:00 UTC = 08:00–22:00 МСК, раз в час: 15 прогонов в сутки (~450 мин/мес
    # из 2000 бесплатных). Круглосуточно было бы 720 — на это минут уже не хватает.
    # Окно можно сузить дальше в листе «Мониторинг цен» (без правки кода).
    - cron: "10 5-19 * * *"

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install PyJWT cryptography

      - name: Секреты -> файлы
        env:
          API_KEYS: ${{ secrets.API_KEYS_FILE }}
          API_KEYS_EXTRA: ${{ secrets.API_KEYS_EXTRA }}
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          printf '%s' "$API_KEYS" > api_keys.txt
          printf '\n%s\n' "$API_KEYS_EXTRA" >> api_keys.txt
          printf '%s' "$SA_JSON" > google_sa.json

      - name: Монитор цен
        env:
          DRY: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # PRICES_GSHEET_ID — список таблиц через запятую; мониторим те, где
          # в группах есть конкуренты (лист Ozon состоит из одних наших SKU)
          IDS=$(grep -h '^PRICES_GSHEET_ID=' api_keys.txt | tail -1 | cut -d= -f2)
          IDS=${IDS:-$(echo "")}
          rc=0
          for id in $(echo "$IDS" | tr ',' ' '); do
            echo "=== таблица $id ==="
            python3 -u scripts/price_watch.py \
              --keys api_keys.txt --sa google_sa.json --sheet-id "$id" \
              ${DRY:+--dry-run} ${FORCE:+--force} || rc=1
          done
          exit $rc

      - name: Убрать секреты
        if: always()
        run: rm -f api_keys.txt google_sa.json
