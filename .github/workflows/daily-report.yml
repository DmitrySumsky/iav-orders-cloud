name: Ежедневный отчёт по заказам WB+Ozon (TrueStats)

on:
  workflow_dispatch:
    inputs:
      brands:
        description: "Бренды через запятую (пусто = все)"
        required: false
        default: ""
      skip_tg:
        description: "1 = только собрать данные, без отправки в TG"
        required: false
        default: ""
  schedule:
    # 03:45 UTC = 06:45 МСК — подстраховочный сбор БЕЗ отправки (SKIP_TG).
    # Боевая отправка в 07:30 МСК приходит через cron-job.org -> workflow_dispatch.
    - cron: "45 3 * * *"

permissions:
  contents: write           # коммит накопленной истории обратно

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest   # TrueStats-ядро собирается за минуты — облака хватает
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install PyJWT cryptography pillow openpyxl

      - name: Секреты -> файлы
        env:
          API_KEYS: ${{ secrets.API_KEYS_FILE }}
          API_KEYS_EXTRA: ${{ secrets.API_KEYS_EXTRA }}
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          printf '%s' "$API_KEYS" > api_keys.txt
          printf '\n%s\n' "$API_KEYS_EXTRA" >> api_keys.txt
          printf '%s' "$SA_JSON" > google_sa.json
          python3 -c "import json; print('SA:', json.load(open('google_sa.json')).get('client_email'))" || echo "SA нет — Google Sheets будут пропущены"

      - name: Конвейер по всем брендам
        env:
          TIME_BUDGET: "86400"
          SKIP_TG: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.skip_tg }}
          HISTORY_DAYS: "8"
          BRANDS: ${{ github.event.inputs.brands || 'NATURI,4ME,HEALTH FORM,SUNSHINE,VEXOR,ORZAX,LOVE&DOVE' }}
        run: python3 -u scripts/run_all_ts.py

      - name: Сохранить историю (коммит state/)
        if: always()
        run: |
          rm -f api_keys.txt google_sa.json api_keys_merged.txt
          git config user.name "report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "история за $(date -u +%F)"
          git pull --rebase origin main || true
          git push
        continue-on-error: true

      - name: Excel-файлы как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/*.xlsx
          retention-days: 14
