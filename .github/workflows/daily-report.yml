name: Ежедневный отчёт по заказам WB+Ozon

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 03:00 МСК: ночной сбор данных (без отправки в TG, см. SKIP_TG)        # кнопка ручного запуска

permissions:
  contents: write           # чтобы коммитить накопленную историю обратно

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install PyJWT cryptography pillow openpyxl

      - name: Секреты -> файлы
        env:
          API_KEYS: ${{ secrets.API_KEYS_FILE }}
          API_KEYS_EXTRA: ${{ secrets.API_KEYS_EXTRA }}
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          printf '%s' "$API_KEYS" > api_keys.txt
          printf '\n%s\n' "$API_KEYS_EXTRA" >> api_keys.txt
          printf '%s' "$SA_JSON" > google_sa.json
          python3 -c "import json; print('SA JSON валиден, client_email:', json.load(open('google_sa.json'))['client_email'])"

      - name: Конвейер по всем брендам
        env:
          TIME_BUDGET: "86400"
          SKIP_TG: ${{ github.event_name == 'schedule' && '1' || '' }}
          HISTORY_DAYS: "8"
          BRANDS: "VEXOR,ORZAX,LOVE&DOVE,SUNSHINE,HEALTH FORM,4ME,NATURI"
        run: python3 -u scripts/run_all.py

      - name: Сохранить историю (коммит state/)
        if: always()
        run: |
          rm -f api_keys.txt google_sa.json
          git config user.name "report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "история за $(date -u +%F)"
          git push

      - name: Excel-файлы как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/*.xlsx
          retention-days: 14
