name: Монитор цен «мы стали дороже» (почасовой)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = посчитать и показать в логе, ничего не слать"
        required: false
        default: ""
      force:
        description: "1 = прислать ВСЕ текущие превышения, игнорируя прошлое состояние"
        required: false
        default: ""
  schedule:
    # v1.2.0, 06.08.2026: почасовой прогон 9:00–16:00 МСК. UTC = МСК−3.
    # Спама от частоты не будет: повторное уведомление по позиции уходит только
    # если разрыв вырос на REALERT_STEP п.п., а выход из сигнала — по гистерезису.
    # Три раза в день (9, 13, 16 — настройка «Полный отчёт в часы») тот же прогон
    # шлёт ПОЛНУЮ картину, чтобы висящая весь день позиция не пропадала из чата.
    # Крон ходит все семь дней, а дни и часы решает лист «Мониторинг цен»
    # (по умолчанию пн-пт 9-16): выходные включаются правкой ОДНОЙ ячейки, без
    # деплоя, а прогон в неразрешённый день выходит на проверке окна за секунды.
    - cron: "0 6-13 * * *"

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Секреты -> файлы
        env:
          API_KEYS: ${{ secrets.API_KEYS_FILE }}
          API_KEYS_EXTRA: ${{ secrets.API_KEYS_EXTRA }}
          SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          # tr -d '\r': секреты заливались с Windows (CRLF), и \r уезжал в конец
          # значения ключа — PRICES_GSHEET_ID со вторым id ломал URL Sheets API
          printf '%s' "$API_KEYS" | tr -d '\r' > api_keys.txt
          printf '\n%s\n' "$API_KEYS_EXTRA" | tr -d '\r' >> api_keys.txt
          printf '%s' "$SA_JSON" > google_sa.json

      - name: Монитор цен
        env:
          DRY: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # Книги монитора отвязаны от книг ежедневного обновления цен
          # (v2.1.0, 14.08.2026): рабочая книга контроля — «Анализ конкурентов
          # (цены) все бренды», свои колонки дат она ведёт сама, и prices_update
          # ей не нужен. PRICE_WATCH_SHEETS пусто — работаем по PRICES_GSHEET_ID,
          # как раньше.
          IDS=$(grep -h '^PRICE_WATCH_SHEETS=' api_keys.txt | tail -1 | cut -d= -f2)
          if [ -z "$IDS" ]; then
            IDS=$(grep -h '^PRICES_GSHEET_ID=' api_keys.txt | tail -1 | cut -d= -f2)
          fi
          rc=0
          for id in $(echo "$IDS" | tr ',' ' '); do
            echo "=== таблица $id ==="
            python3 -u scripts/price_watch.py \
              --keys api_keys.txt --sa google_sa.json --sheet-id "$id" \
              ${DRY:+--dry-run} ${FORCE:+--force} || rc=1
          done
          exit $rc

      - name: Убрать секреты
        if: always()
        run: rm -f api_keys.txt google_sa.json
